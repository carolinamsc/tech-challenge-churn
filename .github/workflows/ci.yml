name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest --cov=src --cov-report=term-missing

  model-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Download dataset
        run: python -m src.data.download
      - name: Cross-validation
        run: python -m src.models.cross_validation
      - name: Train and compare models
        run: python -m src.models.compare
      - name: Threshold analysis
        run: python -m src.models.threshold_analysis
      - name: Train final artifact
        run: python -m src.models.train
      - name: Upload model outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: |
            models/
            reports/model_results.csv
            reports/cross_validation.csv
            reports/threshold_analysis.csv
      - name: Reports must match committed values
        run: git diff --exit-code -- reports/

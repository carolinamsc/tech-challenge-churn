[project]
name = "tech-challenge-churn"
version = "0.1.0"
description = "Previsão de churn — Tech Challenge FIAP Fase 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.24,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.29,<1",
    "joblib>=1.3,<2",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "jupyter>=1,<2",
    "ipykernel>=6,<7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

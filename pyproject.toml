[project]
name = "tech-challenge-churn"
version = "0.1.0"
description = "Tech Challenge FIAP Fase 1 - Previsão de churn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "pydantic>=2.5,<3",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<7",
    "ruff>=0.6,<1",
    "ipykernel>=6.26,<7",
    "jupyter>=1,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET"]
